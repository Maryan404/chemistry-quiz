<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Географічний Турнір • 7 клас (§ 8–20)</title>
    <style>
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --success: #16a34a;
            --danger: #dc2626;
            --warning: #d97706;
            --bg: #f0f9ff;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #64748b;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body {
            margin: 0; padding: 16px;
            background: linear-gradient(135deg, #e0f2fe 0%, #dcfce7 100%);
            color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .container {
            background: var(--card); width: 100%; max-width: 640px; padding: 26px;
            border-radius: 22px; box-shadow: 0 12px 30px rgba(2, 132, 199, 0.12); position: relative;
        }
        .subject-nav {
            display: flex; justify-content: center; gap: 8px; margin-bottom: 14px; padding-right: 40px;
        }
        .subj-link {
            text-decoration: none; padding: 6px 14px; border-radius: 20px; font-size: 0.85rem;
            font-weight: 700; border: 1.5px solid #cbd5e1; color: var(--muted); background: #f8fafc; transition: 0.2s;
        }
        .subj-link:hover { border-color: var(--primary); color: var(--primary); }
        .subj-link.active { background: var(--primary); color: #fff; border-color: var(--primary); }

        .sound-toggle {
            position: absolute; top: 18px; right: 18px; width: 42px; height: 42px;
            border-radius: 50%; border: 1.5px solid #cbd5e1; background: #f8fafc;
            cursor: pointer; font-size: 1.25rem; display: flex; align-items: center; justify-content: center;
            transition: 0.2s; padding: 0;
        }
        .sound-toggle:hover { background: #e2e8f0; transform: scale(1.06); }
        .sound-toggle.muted { opacity: 0.6; background: #fee2e2; border-color: #fca5a5; }

        h1 { margin: 0 0 6px; font-size: 1.55rem; text-align: center; color: var(--primary); }
        .sub { text-align: center; color: var(--muted); font-size: 0.9rem; margin-bottom: 18px; }
        
        .controls {
            display: flex; flex-direction: column; gap: 12px; margin-bottom: 18px;
            background: #f8fafc; padding: 16px; border-radius: 14px; border: 1px solid #e2e8f0;
        }
        label { font-size: 0.92rem; font-weight: 600; color: #334155; display: block; margin-bottom: 5px; }
        input[type="text"] {
            width: 100%; padding: 11px 14px; border-radius: 10px;
            border: 1.5px solid #cbd5e1; font-size: 1rem; outline: none; transition: 0.2s;
        }
        input[type="text"]:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15); }

        .topic-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .topic-btn {
            padding: 10px; border-radius: 10px; border: 1.5px solid #cbd5e1; background: #fff;
            font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: 0.2s; color: var(--text);
        }
        .topic-btn:hover { border-color: var(--primary); background: #f8fafc; }
        .topic-btn.active {
            background: #e0f2fe; border-color: var(--primary); color: var(--primary-dark);
            box-shadow: 0 2px 8px rgba(2, 132, 199, 0.15);
        }
        .topic-btn.full-width { grid-column: span 2; font-size: 0.92rem; }

        .stats {
            display: flex; justify-content: space-between; align-items: center; background: #f8fafc;
            padding: 10px 14px; border-radius: 10px; font-weight: 700; font-size: 0.92rem; color: var(--muted); margin-bottom: 14px;
        }
        .timer-badge { color: var(--primary); font-variant-numeric: tabular-nums; font-size: 1.05rem; }

        .q-box {
            background: #f0f9ff; border: 2px solid #bae6fd; border-radius: 16px;
            padding: 20px 16px; margin-bottom: 16px; font-size: 1.12rem; font-weight: 700; line-height: 1.4;
        }
        .q-topic-tag { font-size: 0.78rem; color: var(--primary); text-transform: uppercase; margin-bottom: 6px; font-weight: 800; }
        .options { display: flex; flex-direction: column; gap: 10px; }
        .opt-btn {
            text-align: left; padding: 14px 16px; border-radius: 12px; border: 2px solid #e2e8f0;
            background: #fff; font-size: 0.96rem; font-weight: 600; color: var(--text); cursor: pointer; transition: 0.15s;
        }
        .opt-btn:hover:not(:disabled) { border-color: var(--primary); background: #f8fafc; }
        .opt-btn.correct { background: #dcfce7; border-color: var(--success); color: #14532d; }
        .opt-btn.wrong { background: #fee2e2; border-color: var(--danger); color: #7f1d1d; }
        
        .main-btn {
            width: 100%; padding: 14px; border: none; border-radius: 12px;
            background: var(--primary); color: #fff; font-size: 1rem; font-weight: 700; cursor: pointer; transition: 0.2s;
        }
        .main-btn:hover { background: var(--primary-dark); }
        
        .explain-box {
            margin-top: 12px; padding: 12px; border-radius: 10px; background: #fefce8;
            border: 1px solid #fde047; font-size: 0.9rem; color: #713f12; line-height: 1.35;
        }

        .leaderboard { margin-top: 20px; border-top: 1px solid #e2e8f0; padding-top: 15px; }
        .lb-header { display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 10px; }
        .lb-header h3 { margin: 0; font-size: 1rem; color: #334155; }
        .refresh-btn {
            padding: 5px 10px; font-size: 0.82rem; background: #f1f5f9;
            border: 1px solid #cbd5e1; border-radius: 8px; color: #334155; cursor: pointer; font-weight: 600;
        }
        .refresh-btn:hover { background: #e2e8f0; }

        .lb-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
        .lb-table th { text-align: left; color: var(--muted); padding: 6px 8px; border-bottom: 2px solid #e2e8f0; }
        .lb-table td { padding: 8px; border-bottom: 1px solid #f1f5f9; }
        .lb-table tr:nth-child(1) td { font-weight: 700; color: #b45309; background: #fffbeb; }
        .badge-attempts {
            background: #e2e8f0; color: #475569; padding: 2px 6px;
            border-radius: 6px; font-size: 0.75rem; font-weight: 600;
        }

        .mistakes {
            max-height: 220px; overflow-y: auto; background: #fff1f2; padding: 12px;
            border-radius: 12px; margin: 14px 0; font-size: 0.9rem; text-align: left;
        }
        .footer-signature {
            margin-top: 22px; text-align: center; font-size: 0.85rem;
            color: var(--muted); font-weight: 500; user-select: none;
        }
        .footer-signature span { color: #e11d48; cursor: pointer; padding: 4px; }
        .hidden { display: none; }
        @media (max-width: 500px) {
            .topic-grid { grid-template-columns: 1fr; }
            .topic-btn.full-width { grid-column: span 1; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="subject-nav">
        <a href="index.html" class="subj-link">🧪 Хімія</a>
        <a href="geo.html" class="subj-link active">🌍 Географія</a>
    </div>
    <button class="sound-toggle" id="sound-btn" onclick="toggleSound()" title="Увімкнути/вимкнути звук">🔊</button>
    <h1>🌍 Географічний Турнір</h1>
    <div class="sub">7 клас (§ 8–20): Тектоніка, ери, повітряні маси, клімат, зони та населення</div>

    <div id="setup-view">
        <div class="controls">
            <div>
                <label for="player-name">Твоє ім'я або нікнейм:</label>
                <input type="text" id="player-name" placeholder="Наприклад: Софія" maxlength="25">
            </div>

            <div>
                <label>Обери тему змагання:</label>
                <div class="topic-grid">
                    <button type="button" class="topic-btn full-width active" onclick="setTopic('all', this)">🏆 Усі теми разом (§ 8–20 • 36 питань)</button>
                    <button type="button" class="topic-btn" onclick="setTopic('tectonics', this)">🌋 § 8–10: Ери, літосфера, рельєф (12)</button>
                    <button type="button" class="topic-btn" onclick="setTopic('climate', this)">🌪️ § 11–13: Повітряні маси і клімат (11)</button>
                    <button type="button" class="topic-btn" onclick="setTopic('nature', this)">🌲 § 14–16: Зони, гори, водні маси (7)</button>
                    <button type="button" class="topic-btn" onclick="setTopic('people', this)">👥 § 17–20: Населення та оболонка (6)</button>
                </div>
            </div>
        </div>

        <button class="main-btn" onclick="startQuiz()">🚀 Почати змагання</button>

        <div class="leaderboard">
            <div class="lb-header">
                <h3 id="lb-title">🏆 Таблиця лідерів (Усі теми)</h3>

    <div id="quiz-view" class="hidden">
        <div class="stats">
            <span id="player-badge">👤 Гравець</span>

        <div class="q-box">

<script>
const CLOUD_DB_URL = "https://chemistry-9d2fa-default-rtdb.firebaseio.com/scores.json";

let soundEnabled = localStorage.getItem("geo_sound") !== "off";
let audioCtx = null;

function getAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
}

function toggleSound() {
    soundEnabled = !soundEnabled;
    localStorage.setItem("geo_sound", soundEnabled ? "on" : "off");
    updateSoundBtn();
    if (soundEnabled) playTone(660, "sine", 0.1, 0);
}

function updateSoundBtn() {
    const btn = document.getElementById("sound-btn");
    btn.innerText = soundEnabled ? "🔊" : "🔇";
    btn.classList.toggle("muted", !soundEnabled);
}

function playTone(freq, type, duration, delay = 0, vol = 0.16, slideTo = null) {
    if (!soundEnabled) return;
    try {
        const ctx = getAudioCtx();
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime + delay);
        if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, ctx.currentTime + delay + duration);
        gain.gain.setValueAtTime(vol, ctx.currentTime + delay);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + duration);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(ctx.currentTime + delay); osc.stop(ctx.currentTime + delay + duration);
    } catch (e) {}
}

function playRandomSuccessSound() {
    if (!soundEnabled) return;
    const v = Math.floor(Math.random() * 5);
    if (v === 0) { playTone(987.77, "square", 0.08, 0, 0.12); playTone(1318.51, "square", 0.28, 0.08, 0.12); }
    else if (v === 1) { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => playTone(f, "triangle", 0.14, i * 0.06, 0.2)); }
    else if (v === 2) { playTone(320, "sine", 0.28, 0, 0.2, 1150); }
    else if (v === 3) { playTone(880, "sine", 0.12, 0, 0.2); playTone(1174.66, "sine", 0.25, 0.1, 0.2); }
    else { playTone(587.33, "triangle", 0.1, 0, 0.18); playTone(587.33, "triangle", 0.1, 0.11, 0.18); playTone(880, "triangle", 0.3, 0.22, 0.22); }
}

function playRandomWrongSound() {
    if (!soundEnabled) return;
    const v = Math.floor(Math.random() * 4);
    if (v === 0) { [300, 280, 260, 230].forEach((f, i) => playTone(f, "sawtooth", 0.16, i * 0.14, 0.12)); }
    else if (v === 1) { playTone(550, "triangle", 0.35, 0, 0.2, 120); }
    else if (v === 2) { playTone(160, "sawtooth", 0.15, 0, 0.14); playTone(130, "sawtooth", 0.25, 0.15, 0.14); }
    else { playTone(220, "sine", 0.12, 0, 0.2, 420); playTone(420, "sine", 0.22, 0.12, 0.2, 160); }
}

function playFinishFanfare() {
    if (!soundEnabled) return;
    const notes = [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5];
    const delays = [0, 0.1, 0.2, 0.3, 0.45, 0.58];
    const durs = [0.1, 0.1, 0.1, 0.14, 0.12, 0.4];
    notes.forEach((f, i) => playTone(f, "triangle", durs[i], delays[i], 0.22));
}

const questions = [
    { cat: "tectonics", tag: "§ 8–9 • Науки про Землю", q: "Яка наука вивчає загальну історію розвитку Землі за шарами гірських порід?", a: "Геологія", w: ["Тектоніка", "Кліматологія", "Картографія"], exp: "У зошиті записано: Геологія — це наука, яка вивчає історію Землі." },
    { cat: "tectonics", tag: "§ 8–9 • Літосферні плити", q: "Яка наука вивчає будову земної кори, літосферні плити та їхні переміщення?", a: "Тектоніка", w: ["Геоморфологія", "Метеорологія", "Палеонтологія"], exp: "Тектоніка вивчає літосферні плити (великі блоки літосфери, розділені глибинними розломами) та їхні рухи." },
    { cat: "tectonics", tag: "§ 8–9 • Вік порід", q: "Як визначають відносний вік гірських порід?", a: "За рештками скам'янілих тварин і рослин та послідовністю залягання шарів", w: ["Лише за температурою повітря", "За глибиною Світового океану", "За солоністю води"], exp: "Відносний вік визначають за скам'янілими рештками організмів: нижні шари порід є давнішими за верхні." },
    { cat: "tectonics", tag: "§ 8–9 • Геохронологічна шкала", q: "У якій послідовності розташовані геологічні ери від найдавнішої до сучасної?", a: "Архейська ➔ Протерозойська ➔ Палеозойська ➔ Мезозойська ➔ Кайнозойська", w: ["Кайнозойська ➔ Мезозойська ➔ Палеозойська ➔ Архейська", "Палеозойська ➔ Архейська ➔ Мезозойська ➔ Протерозойська ➔ Кайнозойська", "Мезозойська ➔ Протерозойська ➔ Кайнозойська ➔ Архейська"], exp: "Архей і Протерозой (докембрій) — найдавніші, далі Палеозой (давнє життя), Мезозой (середнє) і Кайнозой (нове життя)." },
    { cat: "tectonics", tag: "§ 8–9 • Геологічні періоди", q: "У яку геологічну еру (до якої належать палеогеновий, неогеновий та антропогеновий періоди) утворилися молоді гори Карпати, Альпи, Гімалаї та Анди?", a: "Кайнозойську (епоха альпійської складчастості)", w: ["Архейську (докембрій)", "Палеозойську (герцинська складчастість)", "Мезозойську (крейдовий період)"], exp: "Кайнозойська ера — це сучасна ера, коли відбулася альпійська складчастість і з'явилася людина (антропоген)." },
    { cat: "tectonics", tag: "§ 8–9 • Геологічні періоди", q: "До якої геологічної ери належать тріасовий, юрський та крейдовий періоди (доба динозаврів і формування Кордильєр)?", a: "Мезозойської", w: ["Палеозойської", "Кайнозойської", "Архейської"], exp: "Тріас, юра і крейда — це три періоди мезозойської ери." },
    { cat: "tectonics", tag: "§ 8–9 • Рухи літосферних плит", q: "Що утворюється при горизонтальному сходженні (зіткненні) двох материкових літосферних плит?", a: "Складчасті гори", w: ["Серединно-океанічні хребти", "Глибоководні жолоби", "Плоскі низовини"], exp: "За схемою в зошиті: сходження плит на суходолі утворює гори, розходження в океані — серединно-океанічні хребти, а занурення — глибоководні жолоби." },
    { cat: "tectonics", tag: "§ 8–10 • Тектонічні структури", q: "Як називаються давні, відносно стійкі та вирівняні ділянки земної кори, що мають двошарову будову (кристалічний фундамент і осадовий чохол)?", a: "Платформи", w: ["Області складчастості (рухомі пояси)", "Глибоководні жолоби", "Серединно-океанічні хребти"], exp: "Платформи — це стійкі ділянки земної кори, яким у рельєфі відповідають великі рівнини." },
    { cat: "tectonics", tag: "§ 8–10 • Будова платформи", q: "Як називається ділянка платформи, де кристалічні породи фундаменту виходять на поверхню (у рельєфі їй відповідають височини та плоскогір'я)?", a: "Кристалічний щит", w: ["Плита (вкрита осадовим чохлом)", "Складчастий пояс", "Западина"], exp: "Щитам відповідають височини та плоскогір'я (наприклад, Гвіанське, Бразильське), а плитам — низовини (Амазонська)." },
    { cat: "tectonics", tag: "§ 10 • Практична робота", q: "Які форми рельєфу відповідають Північноамериканській платформі (щиту) та Східноєвропейській платформі?", a: "Лаврентійська височина та Східноєвропейська рівнина", w: ["Гори Кордильєри та Альпи", "Гори Анди та Атлас", "Великий Вододільний хребет"], exp: "На щиті Північноамериканської платформи лежить Лаврентійська височина, а на Східноєвропейській платформі — Східноєвропейська рівнина." },
    { cat: "tectonics", tag: "§ 10 • Практична робота", q: "Які гори утворилися в області герцинської складчастості в Австралії та альпійської складчастості в Африці?", a: "Великий Вододільний хребет (Австралія) та гори Атлас (Африка)", w: ["Кордильєри та Анди", "Піренеї та Карпати", "Гімалаї та Памір"], exp: "За таблицею в зошиті: в Австралії область герцинської складчастості — це Великий Вододільний хребет, а в Африці альпійської — гори Атлас." },

    { cat: "climate", tag: "§ 11–12 • Повітряні маси", q: "Чим морські повітряні маси відрізняються від континентальних повітряних мас тієї ж широти?", a: "Вони містять більше вологи, приносять опади і роблять зиму теплішою, а літо прохолоднішим", w: ["Вони значно сухіші та викликають посухи", "Вони ніколи не заходять на суходіл", "Вони завжди мають температуру нижче 0 °C"], exp: "Формуючись над океанами, морські ПМ насичуються вологою і пом'якшують клімат узбереж." },

function setTopic(cat, btn) {
    currentCat = cat;
    document.querySelectorAll(".topic-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("lb-title").innerText = `🏆 Таблиця лідерів (${topicNames[cat]})`;
    renderLeaderboard();
}

function shuffle(a) { return [...a].sort(() => Math.random() - 0.5); }

function formatTime(sec) {
    const m = Math.floor(sec / 60).toString().padStart(2, "0");
    const s = (sec % 60).toString().padStart(2, "0");
    return `${m}:${s}`;
}

function startQuiz(customList = null) {
    const nameInput = document.getElementById("player-name").value.trim();
    if (!nameInput) {
        playRandomWrongSound();
        alert("Будь ласка, введи своє ім'я перед початком!");
        document.getElementById("player-name").focus();
        return;
    }
    playerName = nameInput;
    localStorage.setItem("chem_last_player", playerName);

    if (customList) {
        pool = shuffle(customList);
        isRetryRun = true;
    } else {
        pool = shuffle(currentCat === "all" ? questions : questions.filter(q => q.cat === currentCat));
        isRetryRun = false;
    }

    idx = 0; score = 0; mistakes = [];
    document.getElementById("player-badge").innerText = `👤 ${playerName}`;
    document.getElementById("setup-view").classList.add("hidden");
    document.getElementById("res-view").classList.add("hidden");
    document.getElementById("quiz-view").classList.remove("hidden");
    
    startSec = Date.now();
    elapsedSeconds = 0;
    document.getElementById("q-timer").innerText = "⏱ 00:00";
    clearInterval(timer);
    timer = setInterval(() => {
        elapsedSeconds = Math.floor((Date.now() - startSec) / 1000);
        document.getElementById("q-timer").innerText = `⏱ ${formatTime(elapsedSeconds)}`;
    }, 500);
    renderQ();
}

function renderQ() {
    document.getElementById("next-btn").classList.add("hidden");
    document.getElementById("exp-box").classList.add("hidden");
    const item = pool[idx];
    document.getElementById("q-progress").innerText = `${idx + 1} / ${pool.length}`;
    document.getElementById("q-tag").innerText = item.tag;
    document.getElementById("q-text").innerText = item.q;

    const opts = shuffle([item.a, ...item.w]);
    const list = document.getElementById("opt-list");
    list.innerHTML = "";
    opts.forEach(opt => {
        const b = document.createElement("button");
        b.className = "opt-btn";
        b.innerText = opt;
        b.onclick = () => checkAns(b, opt, item);
        list.appendChild(b);
    });
}

function checkAns(btn, sel, item) {
    document.querySelectorAll(".opt-btn").forEach(b => {
        b.disabled = true;
        if (b.innerText === item.a) b.classList.add("correct");
    });
    if (sel === item.a) {
        score++;
        playRandomSuccessSound();
    } else {
        btn.classList.add("wrong");
        playRandomWrongSound();
        mistakes.push({ item, sel });
    }
    const exp = document.getElementById("exp-box");
    exp.innerHTML = `💡 <b>Пояснення:</b> ${item.exp}`;
    exp.classList.remove("hidden");
    document.getElementById("next-btn").classList.remove("hidden");
}

function nextQ() {
    idx++;
    if (idx < pool.length) renderQ();
    else finishQuiz();
}

async function finishQuiz() {
    clearInterval(timer);
    playFinishFanfare();
    document.getElementById("quiz-view").classList.add("hidden");
    document.getElementById("res-view").classList.remove("hidden");
    document.getElementById("res-score").innerText = `${score} / ${pool.length}`;
    document.getElementById("res-time").innerText = `⏱ Час: ${formatTime(elapsedSeconds)}`;

    const recordMsg = document.getElementById("record-msg");
    if (!isRetryRun) {
        const status = await saveResult(playerName, score, pool.length, elapsedSeconds);
        recordMsg.innerText = status;
    } else {
        recordMsg.innerText = "Роботу над помилками успішно завершено!";
    }

    const mBox = document.getElementById("mistakes-box");
    const rBtn = document.getElementById("retry-btn");
    if (mistakes.length === 0) {
        mBox.classList.add("hidden");
        rBtn.classList.add("hidden");
    } else {
        mBox.classList.remove("hidden");
        rBtn.classList.remove("hidden");
        mBox.innerHTML = mistakes.map(m =>
            `<div style="margin-bottom:8px;">❌ <b>${m.item.q}</b><br>Було обрано: <s>${m.sel}</s><br>✅ Правильно: <b>${m.item.a}</b></div>`
        ).join("<hr style='border:0;border-top:1px solid #fecdd3;'>");
    }
}

function getBoardKey() {
    return `geo_lb_${currentCat}`;
}

async function fetchScores() {
    const key = getBoardKey();
    if (CLOUD_DB_URL) {
        try {
            const res = await fetch(CLOUD_DB_URL.replace(".json", `/${key}.json`) + `?t=${Date.now()}`);
            const data = await res.json();
            return data ? Object.values(data) : [];
        } catch (e) { console.error(e); }
    }
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : [];
}

async function saveResult(name, newScore, total, newTime) {
    const key = getBoardKey();
    let list = await fetchScores();
    const normName = name.trim().toLowerCase();
    
    let existing = list.find(p => p.name.trim().toLowerCase() === normName);
    let msg = "";

    if (existing) {
        existing.attempts = (existing.attempts || 1) + 1;
        const isBetter = (newScore > existing.score) || (newScore === existing.score && newTime < existing.time);
        if (isBetter) {
            existing.score = newScore;
            existing.time = newTime;
            existing.total = total;
            existing.name = name.trim();
            msg = `🔥 Новий особистий рекорд! (Спроба №${existing.attempts})`;
        } else {
            msg = `Спроба №${existing.attempts} зарахована! Твій рекорд: ${existing.score}/${existing.total} за ${formatTime(existing.time)}`;
        }
    } else {
        list.push({ name: name.trim(), score: newScore, total, time: newTime, attempts: 1 });
        msg = "🎉 Тебе додано до таблиці лідерів!";
    }

    localStorage.setItem(key, JSON.stringify(list));

    if (CLOUD_DB_URL) {
        try {
            await fetch(CLOUD_DB_URL.replace(".json", `/${key}.json`), {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(list)
            });
        } catch (e) { console.error(e); }
    }
    return msg;
}

async function renderLeaderboard(manualRefresh = false) {
    const container = document.getElementById("lb-content");
    if (manualRefresh) {
        container.innerHTML = `<div style="text-align:center;color:#64748b;padding:12px;">⏳ Оновлення даних...</div>`;
    }
    let list = await fetchScores();

    if (list.length === 0) {
        container.innerHTML = `<div style="text-align:center;color:#94a3b8;padding:12px;">Ще ніхто не проходив цю тему. Будь першим!</div>`;
        return;
    }

    list.sort((a, b) => (b.score - a.score) || (a.time - b.time));

    const medals = ["🥇", "🥈", "🥉"];
    let html = `<table class="lb-table">
        <thead><tr><th>#</th><th>Учень</th><th>Бали</th><th>Час</th><th>Спроб</th></tr></thead><tbody>`;
    
    list.slice(0, 15).forEach((p, idx) => {
        const rank = medals[idx] || (idx + 1);
        html += `<tr>
            <td>${rank}</td>
            <td>${p.name}</td>
            <td><b>${p.score}</b>/${p.total}</td>
            <td>${formatTime(p.time)}</td>
            <td><span class="badge-attempts">${p.attempts || 1}</span></td>
        </tr>`;
    });
    html += `</tbody></table>`;
    container.innerHTML = html;
}

function retryMistakes() { startQuiz(mistakes.map(m => m.item)); }

function goHome() {
    document.getElementById("res-view").classList.add("hidden");
    document.getElementById("setup-view").classList.remove("hidden");
    renderLeaderboard();
}

let heartClicks = 0;
let heartTimer = null;

async function handleHeartClick() {
    heartClicks++;
    clearTimeout(heartTimer);
    heartTimer = setTimeout(() => { heartClicks = 0; }, 1200);

    if (heartClicks >= 5) {
        heartClicks = 0;
        const pin = prompt("🔒 Адмін-панель\nВведіть пароль доступу:");
        if (!pin) return;

        if (btoa(pin.trim()) === "MTEwMw==") {
            const key = getBoardKey();
            let list = await fetchScores();
            const names = list.map(p => p.name).join(", ") || "таблиця порожня";

            const target = prompt(
                `🛠️ Управління таблицею:\nЗараз у списку: ${names}\n\n` +
                `• Введіть ІМ'Я гравця, щоб видалити лише його\n` +
                `• Введіть ALL (або ВСІ), щоб очистити всю таблицю:`
            );
            if (!target) return;

            const cleanTarget = target.trim().toLowerCase();

            if (cleanTarget === "all" || cleanTarget === "всі") {
                localStorage.removeItem(key);
                if (CLOUD_DB_URL) {
                    try {
                        await fetch(CLOUD_DB_URL.replace(".json", `/${key}.json`), { method: "DELETE" });
                    } catch (e) { console.error(e); }
                }
                renderLeaderboard();
                alert("✅ Всю таблицю лідерів цієї теми очищено!");
            } else {
                const newList = list.filter(p => p.name.trim().toLowerCase() !== cleanTarget);
                if (newList.length === list.length) {
                    alert(`⚠️ Гравця з ім'ям "${target}" не знайдено у поточній таблиці.`);
                    return;
                }
                localStorage.setItem(key, JSON.stringify(newList));
                if (CLOUD_DB_URL) {
                    try {
                        await fetch(CLOUD_DB_URL.replace(".json", `/${key}.json`), {
                            method: "PUT",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify(newList)
                        });
                    } catch (e) { console.error(e); }
                }
                renderLeaderboard();
                alert(`✅ Гравця "${target}" видалено з таблиці!`);
            }
        } else {
            playRandomWrongSound();
            alert("⛔ Невірний пароль! Спробу зафіксовано 😉");
        }
    }
}
